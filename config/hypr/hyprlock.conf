background {
    monitor = 
#    wallpaper = /home/sawa/Pictures/wallpapers/rivendel.jpg
    wallpaper = screenshot
    blur-passes = 0
#    blur_passes = 3
#    blur_size = 8
    noise = 0.011
    contrast = 1.0
    brightness = 0.9
    vibrancy = 0.169
}

input-field {
    monitor =

    size = 20%, 5%
    outline_thickness = 3

    inner_color = rgba(0, 0, 0, 0.0)  # no fill
    outer_color = rgba(d65d0eff)     # Gruvbox orange border
    check_color = rgba(b8bb26ff)     # Optional: green when correct
    fail_color = rgba(fb4934ff)      # Optional: red when incorrect

    font_color = rgb(235, 219, 178)  # Gruvbox light
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}
