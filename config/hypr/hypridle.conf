# General section containing most global idle configs
general {

    # Sets what locking mechanism is use, in this case
    # its hyprlock
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
}

listener {
    timeout = 840
    on-timeout = notify-send "Locking in 1 minute"   
}

listener {
    # Time delay in seconds before the on timeout 
    # action happens
    timeout = 900 # 15 minutes

    # Action to be executed on the specied timeout
    on-timeout = loginctl lock-session
}
